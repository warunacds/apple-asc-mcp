name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck + tests (Node ${{ matrix.node }} on ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  smoke:
    name: MCP boot smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Initialize and list tools over stdio
        run: |
          set -e
          OUT=$(printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | (node dist/index.js 2>/dev/null & PID=$!; sleep 1.5; kill $PID 2>/dev/null; wait $PID 2>/dev/null) )
          echo "$OUT" | head -c 200
          echo
          echo "$OUT" | grep -q '"name":"app-store-connect-mcp"' || (echo "initialize response missing"; exit 1)
          echo "$OUT" | grep -q '"asc_whoami"' || (echo "tools/list missing asc_whoami"; exit 1)
          # Sanity: at least 30 tools registered.
          COUNT=$(echo "$OUT" | grep -o '"name":"asc_\|"name":"xc_' | wc -l | tr -d ' ')
          echo "tool count: $COUNT"
          [ "$COUNT" -ge 30 ] || (echo "expected ≥30 tools, got $COUNT"; exit 1)
